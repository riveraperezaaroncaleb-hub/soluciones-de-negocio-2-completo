<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <meta name="description" content="Reserva tu corte online, descubre ofertas y gana un corte gratis cuando invites a un amigo.">
  <title>Casa Navaja — Barbería de autor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#11130f',
            paper: '#f5f5f0',
            lime: '#c6f36b',
            muted: '#77796f'
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"DM Sans",sans-serif;color:#191b16;background:#f4f1e9;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px}
    button,input{font:inherit}
    button{cursor:pointer}
    .display{font-family:Manrope,sans-serif;letter-spacing:-.045em}
    .app-shell{min-height:100vh}
    .sidebar{width:242px;position:fixed;inset:0 auto 0 0;background:#11130f;color:#f5f5f0;padding:27px 18px;display:flex;flex-direction:column;z-index:20}
    .main{margin-left:242px;min-height:100vh;padding:32px clamp(22px,5vw,68px) 60px}
    .nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 13px;border:0;border-radius:12px;background:transparent;color:#aaaDA3;text-align:left;font-size:14px;transition:.18s}
    .nav-btn:hover,.nav-btn.active{background:#24271f;color:#fff}
    .nav-btn.active .nav-icon{color:#c6f36b}
    .nav-icon{font-size:17px;width:20px;text-align:center}
    .card{background:#fff;border:1px solid #e8e9e1;border-radius:20px}
    .soft-card{background:#efefe8;border-radius:16px}
    .btn-primary{background:#c6f36b;color:#171912;border:0;border-radius:13px;font-weight:700;transition:transform .15s,background .15s}
    .btn-primary:hover{background:#b4e858;transform:translateY(-1px)}
    .btn-dark{background:#171912;color:white;border:0;border-radius:13px;font-weight:700}
    .btn-dark:hover{background:#30332a}
    .btn-outline{background:#fff;color:#20221c;border:1px solid #dedfd6;border-radius:12px;font-weight:600}
    .input{width:100%;height:48px;border:1px solid #dedfd6;border-radius:12px;padding:0 14px;background:white;outline:none}
    .input:focus{border-color:#9cbe53;box-shadow:0 0 0 3px #c6f36b33}
    .step-dot{height:5px;border-radius:20px;background:#e6e7de;flex:1}
    .step-dot.done{background:#b4df5e}
    .service-check:checked{accent-color:#171912}
    .phone-frame{max-width:430px;margin-inline:auto}
    .booking-service.selected{border-color:#171912;background:#f6f7f1;box-shadow:0 0 0 1px #171912}
    .time-chip.selected{background:#171912!important;color:white!important;border-color:#171912!important}
    .funnel-row{display:grid;grid-template-columns:145px minmax(80px,1fr) 44px;align-items:center;gap:13px}
    .funnel-track{height:12px;border-radius:30px;background:#efefe9;overflow:hidden}
    .funnel-bar{height:100%;border-radius:30px;background:#b9e85e}
    .toast{position:fixed;right:22px;bottom:22px;z-index:60;animation:slideup .25s ease-out}
    @keyframes slideup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .mobile-nav{display:none}
    .no-scrollbar::-webkit-scrollbar{display:none}
    .shop-page{margin:0;background:#f4f1e9;min-height:100vh}
    .shop-header{height:74px;padding:0 clamp(20px,7vw,100px);display:flex;align-items:center;justify-content:space-between;background:#fbfaf7;border-bottom:1px solid #e7e1d5}
    .shop-logo{font-family:Manrope,sans-serif;font-size:19px;font-weight:900;letter-spacing:-.06em;display:flex;align-items:center;gap:10px}
    .shop-mark{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:#a65b38;color:#fff;font-size:19px}
    .shop-nav{display:flex;align-items:center;gap:26px;font-size:12px;font-weight:700;color:#68645d}
    .shop-hero{position:relative;overflow:hidden;min-height:525px;display:grid;grid-template-columns:1.04fr .96fr;background:#191714;color:#f8f3e9}
    .shop-hero-copy{position:relative;z-index:2;padding:72px clamp(24px,8vw,112px);display:flex;flex-direction:column;justify-content:center}
    .shop-kicker{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#d4a47b}
    .shop-title{font-family:Manrope,sans-serif;font-size:clamp(46px,6.1vw,82px);font-weight:800;line-height:.98;letter-spacing:-.075em;margin:19px 0}
    .shop-title em{font-family:Georgia,serif;font-weight:400;color:#d4a47b}
    .shop-lede{max-width:390px;color:#c1b9ad;font-size:14px;line-height:1.8}
    .shop-actions{display:flex;align-items:center;gap:18px;margin-top:27px}
    .shop-primary{min-height:51px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#c47d50;color:#171512;padding:0 23px;border:0;border-radius:3px;font-size:12px;font-weight:900;letter-spacing:.04em}
    .shop-primary:hover{background:#d7966b}
    .shop-text-link{color:#f4eee4;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:5px}
    .shop-rating{margin-top:37px;display:flex;align-items:center;gap:12px;color:#b9b0a4;font-size:11px}
    .shop-stars{color:#d49b56;letter-spacing:.15em}
    .shop-photo{position:relative;min-height:525px;background:#33271e url("https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1400&q=85") center 48%/cover}
    .shop-photo:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#191714 0%,transparent 35%),linear-gradient(0deg,#19171455,transparent 58%)}
    .hero-stamp{position:absolute;right:9%;bottom:10%;width:112px;height:112px;border:1px solid #e7b181;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;font-size:9px;line-height:1.55;letter-spacing:.12em;transform:rotate(9deg);background:#201a15aa}
    .hero-stamp b{display:block;color:#e7b181;font-size:20px;letter-spacing:-.05em}
    .shop-section{padding:74px clamp(20px,7vw,100px)}
    .shop-section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
    .shop-eyebrow{font-size:10px;font-weight:900;letter-spacing:.2em;color:#9c5938;text-transform:uppercase}
    .shop-heading{font-family:Manrope,sans-serif;font-size:clamp(28px,4vw,43px);line-height:1.05;letter-spacing:-.06em;font-weight:800;margin:9px 0 0}
    .offer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
    .offer-card{position:relative;overflow:hidden;min-height:230px;padding:25px;background:#e8e1d4}
    .offer-card:nth-child(2){background:#211e19;color:#fbf4e9}
    .offer-card:nth-child(3){background:#d5a77e;color:#221913}
    .offer-num{font-family:Georgia,serif;font-size:45px;line-height:1;color:#a35b39}
    .offer-card:nth-child(2) .offer-num{color:#d8aa7b}
    .offer-card:nth-child(3) .offer-num{color:#fff1df}
    .offer-tag{position:absolute;top:17px;right:17px;padding:7px 9px;background:#f5f0e5;border-radius:2px;color:#70452f;font-size:9px;font-weight:900;letter-spacing:.1em}
    .offer-card h3{font-family:Manrope,sans-serif;font-size:20px;font-weight:800;letter-spacing:-.04em;margin:17px 0 6px}
    .offer-card p{max-width:260px;font-size:12px;line-height:1.6;color:#777065}
    .offer-card:nth-child(2) p{color:#bdb2a4}
    .offer-card:nth-child(3) p{color:#55402e}
    .offer-price{margin-top:19px;font-size:13px;font-weight:800}
    .offer-price s{margin-left:7px;color:#958a7d;font-weight:500}
    .shop-referral{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:clamp(26px,5vw,55px);background:#d8e0cb}
    .referral-title{font-family:Manrope,sans-serif;font-size:clamp(30px,4.2vw,49px);line-height:1.02;letter-spacing:-.065em;font-weight:800;margin:12px 0}
    .referral-title em{font-family:Georgia,serif;color:#8e4d32;font-weight:400}
    .referral-copy{max-width:450px;color:#606354;font-size:13px;line-height:1.8}
    .referral-ticket{padding:22px;background:#f8f5ed;border:1px dashed #9a886a;transform:rotate(1deg)}
    .referral-ticket-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ded5c5;padding-bottom:15px}
    .referral-code{margin:18px 0 5px;font-family:Manrope,sans-serif;font-size:20px;font-weight:900;letter-spacing:.06em}
    .shop-foot{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:25px clamp(20px,7vw,100px);background:#191714;color:#bcb3a6;font-size:11px}
    .shop-foot b{color:#f6eee2}
    .loyalty-banner{border:1px solid #eadfce;background:#f8f4eb}
    .booking-shell{background:#f4f1e9}
    .booking-head{background:#191714}
    .copper-button{background:#b96843!important;color:#fff!important}
    .copper-button:hover{background:#a45635!important}
    .referral-progress{height:9px;border-radius:20px;background:#e8e2d7;overflow:hidden}
    .referral-progress span{display:block;height:100%;border-radius:20px;background:#b96843}
    @media(max-width:850px){
      .sidebar{display:none}.main{margin-left:0;padding:25px 18px 100px}.mobile-nav{display:flex}
      .shop-hero{min-height:0;grid-template-columns:1fr}
      .shop-hero-copy{padding:50px 27px 38px}
      .shop-photo{min-height:280px;background-position:center 45%}
      .shop-photo:before{background:linear-gradient(0deg,#19171444,transparent 65%)}
      .shop-title{font-size:clamp(49px,12vw,75px)}
      .shop-section{padding:48px 25px}
      .shop-referral{grid-template-columns:1fr;gap:23px}
    }
    @media(max-width:580px){
      .main{padding:18px 14px 96px}.funnel-row{grid-template-columns:112px minmax(50px,1fr) 38px;gap:8px}.funnel-label{font-size:11px}
      .card{border-radius:17px}.mobile-nav{padding-bottom:max(8px,env(safe-area-inset-bottom))}
      .shop-header{height:63px;padding:0 18px}
      .shop-nav{gap:11px}.shop-nav a:first-child{display:none}
      .shop-hero-copy{padding:42px 22px 30px}
      .shop-title{font-size:54px}
      .shop-photo{min-height:230px}
      .shop-section{padding:43px 18px}
      .shop-section-head{align-items:start;flex-direction:column}
      .offer-grid{grid-template-columns:1fr;gap:10px}
      .offer-card{min-height:185px;padding:20px}
      .offer-card h3{margin-top:10px}
      .offer-num{font-size:35px}
      .shop-referral{padding:24px 19px}
      .shop-foot{padding:20px;align-items:start;flex-direction:column}
      .shop-actions{align-items:start;flex-direction:column}
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toast-root"></div>
  <script src="/app.js" defer></script>
</body>
</html>
